<script>
(function(){
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") n.className = v; else n.setAttribute(k, v);
    });
    kids.flat().forEach(k => k != null && k !== "" && n.append(k));
    return n;
  };
  const ext = url => /^https?:/.test(url) ? { target: "_blank", rel: "noopener" } : {};
  const linkEl = (label, url) => el("a", Object.assign({ href: url }, ext(url)), label);
  const scholarSearch = t => "https://scholar.google.com/scholar?q=" + encodeURIComponent('"' + t.replace(/[’]/g, "'") + '"');

  $("bar-name").textContent = SITE.name;
  $("name").textContent = SITE.name;
  $("role").textContent = SITE.role;
  $("aff").textContent = SITE.affiliation;
  $("bio").textContent = SITE.bio;

  const parts = SITE.name.split(/\s+/);
  const initials = (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  $("portrait").append(SITE.photo
    ? el("img", { class: "portrait", src: SITE.photo, alt: "Portrait of " + SITE.name })
    : el("div", { class: "portrait", "aria-hidden": "true" }, initials));

  SITE.links.filter(l => l.url).forEach(l => $("links").append(el("li", {}, linkEl(l.label, l.url))));
  SITE.interests.forEach(i => $("interests").append(el("li", {}, i)));
  SITE.updates.forEach(u => $("updates").append(el("li", {}, el("span", { class: "when" }, u.date), el("span", {}, u.text))));

  function pubItem(p, id) {
    const authors = el("p", { class: "a" });
    p.authors.forEach((a, j) => {
      authors.append(a === SITE.me ? el("b", {}, a) : a);
      if (j < p.authors.length - 1) authors.append(", ");
    });
    const actions = el("div", { class: "actions" });
    if (p.pdf) actions.append(linkEl("PDF", p.pdf));
    if (p.code) actions.append(linkEl("Code", p.code));
    if (p.doi) actions.append(linkEl("DOI", "https://doi.org/" + p.doi));
    else if (p.findable !== false) actions.append(linkEl("Find paper", scholarSearch(p.title)));
    const item = el("li", { class: "pub" }, el("p", { class: "t" }, p.title), authors, el("p", { class: "v" }, p.venue), actions);
    if (p.bibtex) {
      const btn = el("button", { type: "button", "aria-expanded": "false", "aria-controls": id }, "Cite");
      const copy = el("button", { type: "button" }, "Copy BibTeX");
      const box = el("div", { class: "bib", id }, el("div", {}, el("pre", {}, p.bibtex), el("div", { class: "actions" }, copy)));
      box.inert = true;
      btn.addEventListener("click", () => {
        const open = box.classList.toggle("open");
        btn.setAttribute("aria-expanded", open);
        box.inert = !open;
      });
      copy.addEventListener("click", () => {
        navigator.clipboard.writeText(p.bibtex).then(() => {
          copy.textContent = "Copied";
          setTimeout(() => (copy.textContent = "Copy BibTeX"), 1600);
        });
      });
      actions.append(btn);
      item.append(box);
    }
    return item;
  }

  const byYear = {};
  SITE.publications.forEach(p => (byYear[p.year] = byYear[p.year] || []).push(p));
  Object.keys(byYear).sort((a, b) => b - a).forEach(year => {
    const list = el("ul", { class: "pubs" });
    byYear[year].forEach((p, i) => list.append(pubItem(p, "bib-" + year + "-" + i)));
    $("pubs").append(el("div", { class: "year" }, el("h3", {}, year), list));
  });
  SITE.underReview.forEach((p, i) => $("review").append(pubItem(Object.assign({ findable: false }, p), "rev-" + i)));
  SITE.patents.forEach((p, i) => $("patents").append(pubItem(Object.assign({ findable: false }, p), "pat-" + i)));

  SITE.projects.forEach(pr => {
    const actions = el("div", { class: "actions" }, (pr.links || []).map(l => linkEl(l.label, l.url)));
    $("project-list").append(el("li", { class: "project" }, el("h3", {}, pr.title), el("p", {}, pr.text), actions));
  });

  SITE.experience.forEach(x => $("exp").append(el("li", {},
    el("span", { class: "when" }, x.when),
    el("span", {}, x.what, el("span", { class: "where" }, x.where)))));
  SITE.awards.forEach(a => $("award-list").append(el("li", {}, a)));

  const email = SITE.links.find(l => l.url.startsWith("mailto:"));
  $("contact").append(
    "Interested in collaborating on speech AI, edge hardware or circuit design? ",
    email ? linkEl("Email me", email.url) : "",
    el("br"), "© " + new Date().getFullYear() + " " + SITE.name
  );
})();
</script>
</body>
</html>
